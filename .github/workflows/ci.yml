name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck at the strictest severity
        run: shellcheck -s sh -S style scripts/esxi-pt.sh tests/run.sh

  tests:
    runs-on: ubuntu-latest
    name: tests (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        # ESXi's own shell is BusyBox ash, so that run is the one that matters.
        shell: [dash, bash, 'busybox sh']
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash busybox
      - name: Run the test-suite
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: $SHELL_UNDER_TEST tests/run.sh
